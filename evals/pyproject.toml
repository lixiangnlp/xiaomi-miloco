[project]
name = "miloco-evals"
version = "0.1.0"
description = "Miloco Agent 行为评测：快照用例 + code scorer + 录制回放 + CI 基线"
readme = "recordings/README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.1",
  "pydantic>=2.13.4",
]

[project.scripts]
evals = "miloco_evals.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["miloco_evals"]

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "ruff>=0.15.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
